name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Require the tag to match the project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected_tag = f"v{project['version']}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Release tag {actual_tag!r} does not match {expected_tag!r}")
          print(f"Validated {project['name']} {project['version']} from {actual_tag}")
          PY
      - name: Install isolated build validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution files
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, found {wheels!r} and {sdists!r}")
          if not wheels[0].name.startswith(f"swarmfl-{version}-"):
              raise SystemExit(f"Unexpected wheel filename: {wheels[0].name}")
          if sdists[0].name != f"swarmfl-{version}.tar.gz":
              raise SystemExit(f"Unexpected sdist filename: {sdists[0].name}")
          print(wheels[0].name)
          print(sdists[0].name)
          PY
      - name: Upload checked distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/swarmfl
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checked distributions from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-${{ github.sha }}
          path: dist/
      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
