name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,research,qwen]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m build
      - name: Audit distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          prohibited_prefixes = (
              "fed_med_agents/experiments/",
              "src/fed_med_agents/experiments/",
              "scripts/",
              "tests/",
              "docs/devlog/",
              "artifacts/",
              "data/",
              "datasets/",
              "checkpoints/",
              "models/",
              "outputs/",
              "research/runs/",
              "research/artifacts/",
              "research/checkpoints/",
              "research/logs/",
          )
          prohibited_suffixes = (
              ".pt", ".pth", ".ckpt", ".onnx", ".joblib", ".pkl", ".pickle",
              ".parquet", ".feather", ".npy", ".npz", ".sqlite", ".sqlite3",
              ".safetensors", ".h5", ".hdf5", ".pem", ".key", ".p12", ".pfx",
              ".crt", ".cer", ".log",
          )

          def normalize(name: str) -> str:
              parts = PurePosixPath(name).parts
              if parts and parts[0].startswith("swarmfl-"):
                  parts = parts[1:]
              return "/".join(parts)

          def prohibited(name: str) -> bool:
              path = normalize(name)
              lowered = path.lower()
              return (
                  any(path == prefix.rstrip("/") or path.startswith(prefix) for prefix in prohibited_prefixes)
                  or lowered.endswith(prohibited_suffixes)
                  or (
                      PurePosixPath(path).name == ".env"
                      or (
                          PurePosixPath(path).name.startswith(".env.")
                          and PurePosixPath(path).name != ".env.example"
                      )
                  )
              )

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = archive.getnames()

          for archive, names in ((wheel, wheel_names), (sdist, sdist_names)):
              rejected = sorted(name for name in names if prohibited(name))
              if rejected:
                  raise SystemExit(f"Prohibited content in {archive}: {rejected}")

          normalized_wheel = {normalize(name) for name in wheel_names}
          normalized_sdist = {normalize(name) for name in sdist_names}
          required_wheel = {
              "fed_med_agents/__init__.py",
              "fed_med_agents/quickstart.py",
              "fed_med_agents/collaboration/registry.py",
          }
          required_sdist = {
              "pyproject.toml",
              "README.md",
              "examples/custom_specialist.py",
              "research/results.md",
          }
          if missing := required_wheel - normalized_wheel:
              raise SystemExit(f"Required wheel content missing: {sorted(missing)}")
          if missing := required_sdist - normalized_sdist:
              raise SystemExit(f"Required sdist content missing: {sorted(missing)}")
          print(f"Audited {len(wheel_names)} wheel entries and {len(sdist_names)} sdist entries")
          PY
      - run: python -m twine check dist/*
      - name: Install and exercise wheel in a fresh environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -c "import fed_med_agents; print(fed_med_agents.__version__)"
          "${RUNNER_TEMP}/wheel-venv/bin/swarmfl-quickstart" --output smoke-output --feedback
          "${RUNNER_TEMP}/wheel-venv/bin/python" "${GITHUB_WORKSPACE}/examples/custom_specialist.py"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install ".[dev]"
      # Flower 1.40.0 constrains uv<0.13.0 even though SwarmFL does not invoke
      # Flower's uv-backed CLI. Replace that audit-only helper with the first
      # release containing the PYSEC-2026-4321 fix until Flower widens its bound.
      - run: python -m pip install --no-deps "certifi>=2026.10.19" "uv==0.13.4"
      # Flower 1.40.0 still pins Ray 2.55.1. PYSEC-2026-2273 is confined to
      # ray.data.read_webdataset unsafe pickle/PT decoding; SwarmFL never calls
      # Ray Data or accepts WebDataset inputs. Torch currently requires setuptools
      # <82, so PYSEC-2026-3447 remains installed; releases build in PEP 517
      # isolation with setuptools>=83 and archives receive a separate content scan.
      # SECURITY.md records both residual risks. Remove exceptions when upstreams move.
      - run: >-
          python -m pip_audit
          --ignore-vuln PYSEC-2026-2273
          --ignore-vuln PYSEC-2026-3447
